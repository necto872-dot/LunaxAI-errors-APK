name: Check server zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  check-server:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Начать работу
        uses: actions/checkout@v4

      - name: 2. Найти зип и распаковать
        id: find
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          mkdir -p /tmp/unpacked
          if [ -n "$ZIP" ]; then
            echo "Нашёл зип: $ZIP"
            unzip -o "$ZIP" -d /tmp/unpacked
          else
            echo "Зип не найден — проверяю сам репозиторий как есть."
            cp -r . /tmp/unpacked/
          fi
          SRC=/tmp/unpacked
          if [ "$(find /tmp/unpacked -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && \
             [ "$(find /tmp/unpacked -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            SRC=$(find /tmp/unpacked -mindepth 1 -maxdepth 1 -type d)
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3-5. Проверить сервер целиком, собрать все ошибки за один присест
        run: |
          SRC="${{ steps.find.outputs.src }}"
          cd "$SRC"
          ERRORS=""

          echo "===== Структура папок ====="
          for p in app app/main.py requirements.txt training training/requirements.txt; do
            if [ -e "$p" ]; then
              echo "OK   $p"
            else
              echo "MISS $p"
              ERRORS="$ERRORS\n- отсутствует $p (структура плоская/сломана)"
            fi
          done

          echo ""
          echo "===== requirements.txt: не должно быть ML-пакетов из training/ ====="
          if [ -f requirements.txt ] && grep -Eiq '^(torch|transformers|peft|trl|bitsandbytes|accelerate|datasets|sentencepiece)([=<>~!]|$)' requirements.txt; then
            echo "Найдены лишние пакеты:"
            grep -Eni '^(torch|transformers|peft|trl|bitsandbytes|accelerate|datasets|sentencepiece)([=<>~!]|$)' requirements.txt
            ERRORS="$ERRORS\n- requirements.txt содержит training-зависимости (torch/transformers/и т.п.)"
          else
            echo "Чисто."
          fi

          echo ""
          echo "===== uvicorn объявлен в requirements.txt ====="
          if [ -f requirements.txt ] && grep -qi "^uvicorn" requirements.txt; then
            echo "OK"
          else
            echo "НЕТ"
            ERRORS="$ERRORS\n- uvicorn отсутствует в requirements.txt"
          fi

          echo ""
          echo "===== Python-синтаксис всех .py файлов ====="
          SYNTAX_FAIL=0
          while IFS= read -r f; do
            if ! python3 -m py_compile "$f" 2>/tmp/pyerr; then
              echo "СИНТАКСИС УПАЛ: $f"
              cat /tmp/pyerr
              SYNTAX_FAIL=1
              ERRORS="$ERRORS\n- синтаксическая ошибка в $f"
            fi
          done < <(find app training tests -name "*.py" 2>/dev/null)
          [ "$SYNTAX_FAIL" = "0" ] && echo "Ошибок синтаксиса нет."

          echo ""
          echo "===== Установка зависимостей и импорт app.main ====="
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt 2>/tmp/pip_err || {
              echo "pip install упал:"
              cat /tmp/pip_err
              ERRORS="$ERRORS\n- pip install -r requirements.txt завершился с ошибкой"
            }
            python3 -c "
          import importlib, sys
          try:
              m = importlib.import_module('app.main')
              assert hasattr(m, 'app'), 'app.main не содержит объект app'
              print('app.main импортируется успешно, объект app найден.')
          except Exception as e:
              print('ИМПОРТ УПАЛ:', e)
              sys.exit(1)
          " || ERRORS="$ERRORS\n- app.main не импортируется (см. лог выше)"
            command -v uvicorn >/dev/null || ERRORS="$ERRORS\n- uvicorn не оказался в PATH после установки"
          fi

          echo ""
          echo "===== ИТОГ ====="
          if [ -z "$ERRORS" ]; then
            echo "Ошибок не найдено, сервер выглядит рабочим."
          else
            echo -e "Найденные проблемы:$ERRORS"
            exit 1
          fi
